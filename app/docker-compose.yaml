version: "3.9"

services:
  ml-rest-api:
    image: lendoo73/ml-rest-api:latest
    ports:
      - "8000:8000"
    #environment:
    volumes:
      - C:/docker/Volumes/ml-rest-api/logs:/app/logs
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run ml-api-tunnel
    volumes:
      - C:/Users/LB6306/.cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
